name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dependency install scripts are reviewed and version-pinned in each owning package.json,
# and npm refuses a locked package with an install script that policy does not cover.
env:
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    # Source/build/pixel gates produce one artifact for the parallel browser jobs below.
    timeout-minutes: 30

    steps:
      - name: Check out CED
        uses: actions/checkout@v4

      # One Node for the whole job, and the one `.nvmrc` names, so the build that
      # ships is produced by the toolchain that exercised it. 24 rather than 22 of
      # the versions Angular 22 accepts: 24 is the active LTS where 22 is in
      # maintenance. CEE and cedar-embeddable-term-picker are on the same version.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            browser/package-lock.json

      - name: Use Java 17 for the authoring conformance gate
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          # The oracle POM arrives with the model npm package, after Java setup.
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the browser test dependencies
        run: |
          npm --prefix browser ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Java and TypeScript authoring conformance
        run: npm run test:conformance

      - name: Source boundaries
        run: npm run test:boundaries

      - name: Packaging tests
        run: npm run test:packaging

      - name: Build the element
        run: npm run build

      - name: Build the standalone application
        run: npm run build:app

      # The distribution, from the bytes the build just produced: flatten to one
      # script, hold it to its size ceiling, and stage the package from that exact
      # file. Verified byte for byte afterwards, because the failure this guards
      # against is a staged directory left over from an earlier build — it looks
      # complete and publishes something nobody tested.
      - name: Bundle, measure and stage the distribution
        run: |
          npm run bundle
          npm run check:size
          npm run package:npm

      - name: Save the tested bundle for paired performance measurements
        uses: actions/upload-artifact@v7
        with:
          name: ced-performance-bundle
          path: dist-bundle/cedar-embeddable-designer.js
          if-no-files-found: error
          retention-days: 2

      - name: Save the production build for all browser engines
        uses: actions/upload-artifact@v7
        with:
          name: ced-browser-build
          path: |
            dist
            dist-bundle
          if-no-files-found: error
          retention-days: 2

      # The screenshot baselines, inside Playwright's own image rather than on the
      # runner. A baseline records a machine's glyph rasterisation as much as the
      # application's rendering, and the runner and a developer's laptop were never
      # going to agree on that — so both sides use the one container, and the budget
      # for a difference is zero pixels rather than a tolerance wide enough to hide a
      # real change. The runner is arm64 so it does not emulate the image.
      - name: Visual baselines, in the container that defines them
        run: npm run test:visual

      # Deliberately its own step rather than part of the gate above: this is the
      # one check that can start failing without anyone having changed anything,
      # because it fails on a disclosure rather than on a commit. Kept separate so
      # the reason is legible from the job summary, and placed after the tests so a
      # genuine regression is reported first.
      #
      # `--omit=dev` because only runtime dependencies reach what an embedder
      # downloads. `--audit-level=high` because moderate advisories against build
      # tooling are not worth stopping a merge for, and the value of this step is
      # that a failure means something.
      - name: Audit what ships
        run: npm run audit:prod

  performance:
    name: Standalone performance
    needs: test
    uses: metadatacenter/cedar-development/.github/workflows/frontend-performance-paired.yml@da481d46035a8d8cfac0a088d4ed860da2498073
    with:
      component: ced
      baseline-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
      candidate-artifact: ced-performance-bundle
      harness-ref: da481d46035a8d8cfac0a088d4ed860da2498073

  cef-bundles:
    name: Build real CEE, CEF and CETP integration bundles
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      # Supported release revisions keep dependency downloads reproducible.
      - uses: actions/checkout@v4
        with:
          repository: metadatacenter/cedar-embeddable-editor
          ref: 9675de238db84f23fdf92e2a6e319c398450063d
          path: cedar-embeddable-editor
      - uses: actions/checkout@v4
        with:
          repository: metadatacenter/cedar-embeddable-term-picker
          ref: 3d2a625616c5a8d57d1a6f08f56fc4cbc5f59cfd
          path: cedar-embeddable-term-picker
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            cedar-embeddable-editor/package-lock.json
            cedar-embeddable-editor/visual/package-lock.json
            cedar-embeddable-term-picker/package-lock.json
      - name: Build CEE and CEF from the supported source
        working-directory: cedar-embeddable-editor
        run: |
          npm ci
          npm --prefix visual ci
          npm run build:production
          npm --prefix visual run bundle
          npm --prefix visual run check:fresh
      - name: Build the real term picker
        working-directory: cedar-embeddable-term-picker
        run: |
          npm ci
          npm run dist
      - name: Record the exact integration inputs
        run: |
          git -C cedar-embeddable-editor rev-parse HEAD
          git -C cedar-embeddable-term-picker rev-parse HEAD
          sha256sum cedar-embeddable-editor/visual/public/cedar-embeddable-editor.js
          sha256sum cedar-embeddable-term-picker/dist-bundle/cedar-embeddable-term-picker.js
      - uses: actions/upload-artifact@v7
        with:
          name: ced-real-component-bundles
          path: |
            cedar-embeddable-editor/visual/public/cedar-embeddable-editor.js
            cedar-embeddable-term-picker/dist-bundle/cedar-embeddable-term-picker.js
          if-no-files-found: error
          retention-days: 2

  cef-integration:
    name: Real component contracts (${{ matrix.browser }})
    needs: [test, cef-bundles]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CEDAR_TEST_WORKERS: '2'
      PICKER_BUNDLE: ${{ github.workspace }}/cedar-embeddable-term-picker/dist-bundle/cedar-embeddable-term-picker.js
      CEF_BUNDLE: ${{ github.workspace }}/cedar-embeddable-editor/visual/public/cedar-embeddable-editor.js
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            browser/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v8
        with:
          name: ced-browser-build
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: ced-real-component-bundles
          path: .
      - name: Install test dependencies and the selected engine
        run: |
          npm ci
          npm --prefix browser ci
          ./browser/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      # Keep every existing integration file, including its non-bundle assertions. Discover
      # files from their bundle references so a new dependent spec cannot be silently omitted.
      - name: Test the shared CED build with the real components
        run: |
          sha256sum "$CEF_BUNDLE" "$PICKER_BUNDLE" dist-bundle/cedar-embeddable-designer.js
          specs=$(grep -l -E 'CEF_BUNDLE|PICKER_BUNDLE' browser/tests/*.spec.ts | xargs -n 1 basename | sed 's/\.spec\.ts$//')
          npm run test:browser:prebuilt -- $specs --project=${{ matrix.browser }} --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cef-integration-${{ matrix.browser }}-failures
          path: browser/test-results
          if-no-files-found: ignore

  browser:
    name: Browser contracts (${{ matrix.browser }}, ${{ matrix.shard }}/2)
    env:
      # Match the existing hosted allocation even when local CI sees more CPU cores.
      CEDAR_TEST_WORKERS: '2'
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # All engines exercise the same verified production bytes; no redundant Angular builds.
      - uses: actions/download-artifact@v8
        with:
          name: ced-browser-build
          path: .
      - run: |
          npm ci
          npm --prefix browser ci
          ./browser/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
          npm run test:browser:prebuilt -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2 --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.shard }}-failures
          path: browser/test-results
