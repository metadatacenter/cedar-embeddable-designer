name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Check out CED
        uses: actions/checkout@v4

      # One Node for the whole job, and the one `.nvmrc` names, so the build that
      # ships is produced by the toolchain that exercised it. 24 rather than 22 of
      # the versions Angular 22 accepts: 24 is the active LTS where 22 is in
      # maintenance. CEE and cedar-term-picker are on the same version.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            browser/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the browser test dependencies
        run: |
          npm --prefix browser ci
          ./browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Packaging tests
        run: npm run test:packaging

      - name: Build the element
        run: npm run build

      - name: Build the standalone application
        run: npm run build:app

      # The distribution, from the bytes the build just produced: flatten to one
      # script, hold it to its size ceiling, and stage the package from that exact
      # file. Verified byte for byte afterwards, because the failure this guards
      # against is a staged directory left over from an earlier build — it looks
      # complete and publishes something nobody tested.
      - name: Bundle, measure and stage the distribution
        run: |
          npm run bundle
          npm run check:size
          npm run package:npm

      # Against the file an embedder downloads, in a host page that is not the
      # development server. Everything this suite covers was found by hand in a
      # browser and by nothing else: an element that never registered, a lookup
      # that searched the wrong tree, a menu that closed on its own opening click,
      # an asset the package does not carry.
      - name: Browser tests, against the distribution
        run: npm run test:browser:prebuilt

      # Deliberately its own step rather than part of the gate above: this is the
      # one check that can start failing without anyone having changed anything,
      # because it fails on a disclosure rather than on a commit. Kept separate so
      # the reason is legible from the job summary, and placed after the tests so a
      # genuine regression is reported first.
      #
      # `--omit=dev` because only runtime dependencies reach what an embedder
      # downloads. `--audit-level=high` because moderate advisories against build
      # tooling are not worth stopping a merge for, and the value of this step is
      # that a failure means something.
      - name: Audit what ships
        run: npm run audit:prod
