<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CEDAR Embeddable Template Editor - Web Component Demo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #f8fafc;
    }
    .demo-bar {
      background-color: #0f172a;
      color: #ffffff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .demo-title {
      font-size: 16px;
      font-weight: 600;
    }
    .demo-container {
      padding: 20px;
    }
    .log-box {
      margin-top: 20px;
      background-color: #1e293b;
      color: #38bdf8;
      padding: 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div class="demo-bar">
    <div class="demo-title">External Host Website (Embedding &lt;cedar-embeddable-template-editor&gt;)</div>
    <div style="font-size: 12px; color: #94a3b8;">Web Component Integration Test</div>
  </div>

  <div class="demo-container">
    <!-- Web Component Element -->
    <cedar-embeddable-template-editor
      id="cedar-editor"
      bioportal-api-key="demo-key"
    ></cedar-embeddable-template-editor>

    <div class="log-box">
      <strong>Host Console Log (Listening to 'templateChange' events):</strong>
      <pre id="event-log">Waiting for template changes...</pre>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const editor = document.getElementById('cedar-editor');
      const logEl = document.getElementById('event-log');

      if (editor) {
        editor.addEventListener('templateChange', (e) => {
          logEl.textContent = JSON.stringify(e.detail, null, 2);
        });

        editor.addEventListener('saveTemplate', (e) => {
          alert('Save event caught by host application!');
        });
      }
    });
  </script>

</body>
</html>
