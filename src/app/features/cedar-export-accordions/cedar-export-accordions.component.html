<div class="accordions-container">

  <!-- JSON Schema Accordion -->
  <div class="accordion-card" [class.is-open]="jsonOpen()">
    <div class="accordion-header" (click)="toggleJson()">
      <div class="accordion-title-group">
        <div class="accordion-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        <span class="accordion-title">JSON Schema</span>
      </div>

      <div class="accordion-actions">
        <!-- Copy Button -->
        <button 
          class="btn-copy" 
          [class.copied]="jsonCopied()" 
          (click)="copyJson($event)" 
          [title]="jsonCopied() ? 'Copied!' : 'Copy JSON Schema'"
        >
          <span *ngIf="!jsonCopied()" class="copy-icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </span>
          <span *ngIf="jsonCopied()" class="copied-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span class="copied-label">Copied!</span>
          </span>
        </button>

        <!-- Chevron -->
        <div class="accordion-chevron" [class.rotated]="jsonOpen()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </div>
    </div>

    <!-- JSON Schema Content Drawer -->
    <div *ngIf="jsonOpen()" class="accordion-body animate-fade-in">
      <div class="code-header">
        <span class="line-info">{{ jsonLineCount() }} lines &nbsp;·&nbsp; CEDAR 1.6.0 JSON-LD</span>
        <button class="code-inner-copy" (click)="copyJson($event)">
          {{ jsonCopied() ? '✓ Copied' : 'Copy Code' }}
        </button>
      </div>

      <div class="code-wrapper">
        <div class="line-numbers" aria-hidden="true">
          <span *ngFor="let line of [].constructor(jsonLineCount()); let i = index">{{ i + 1 }}</span>
        </div>
        <pre class="code-content"><code [innerHTML]="highlightedJson()"></code></pre>
      </div>
    </div>
  </div>

  <!-- YAML Accordion -->
  <div class="accordion-card" [class.is-open]="yamlOpen()">
    <div class="accordion-header" (click)="toggleYaml()">
      <div class="accordion-title-group">
        <div class="accordion-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <span class="accordion-title">YAML</span>
      </div>

      <div class="accordion-actions">
        <!-- Copy Button -->
        <button 
          class="btn-copy" 
          [class.copied]="yamlCopied()" 
          (click)="copyYaml($event)" 
          [title]="yamlCopied() ? 'Copied!' : 'Copy YAML'"
        >
          <span *ngIf="!yamlCopied()" class="copy-icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </span>
          <span *ngIf="yamlCopied()" class="copied-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span class="copied-label">Copied!</span>
          </span>
        </button>

        <!-- Chevron -->
        <div class="accordion-chevron" [class.rotated]="yamlOpen()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </div>
    </div>

    <!-- YAML Content Drawer -->
    <div *ngIf="yamlOpen()" class="accordion-body animate-fade-in">
      <div class="code-header">
        <span class="line-info">{{ yamlLineCount() }} lines &nbsp;·&nbsp; CEDAR 1.6.0 YAML</span>
        <button class="code-inner-copy" (click)="copyYaml($event)">
          {{ yamlCopied() ? '✓ Copied' : 'Copy Code' }}
        </button>
      </div>

      <div class="code-wrapper">
        <div class="line-numbers" aria-hidden="true">
          <span *ngFor="let line of [].constructor(yamlLineCount()); let i = index">{{ i + 1 }}</span>
        </div>
        <pre class="code-content"><code [innerHTML]="highlightedYaml()"></code></pre>
      </div>
    </div>
  </div>

</div>
