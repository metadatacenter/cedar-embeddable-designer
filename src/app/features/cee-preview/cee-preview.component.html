<div class="cee-preview">
  <div class="cee-preview__bar">
    <span class="cee-preview__title">{{ 'ceePreview.title' | translate }}</span>
    @if (editorAvailable) {
      <select
        [attr.aria-label]="'ceePreview.mode' | translate"
        [value]="readOnly() ? 'read-only' : 'editable'"
        (change)="readOnly.set($any($event.target).value === 'read-only')"
      >
        <option value="read-only">{{ 'ceePreview.readOnly' | translate }}</option>
        <option value="editable">{{ 'ceePreview.editable' | translate }}</option>
      </select>
    }
    <button
      (click)="service.showPreview.set(false)"
      class="cee-preview__close"
      [title]="'ceePreview.close' | translate"
      [attr.aria-label]="'ceePreview.close' | translate"
      type="button"
    >
      <app-icon key="close" size="small" />
    </button>
  </div>

  @if (editorAvailable) {
    @if (!readOnly()) {
      <p class="cee-preview__notice">
        {{ 'ceePreview.editableNotice' | translate }}
      </p>
    }
    <div class="cee-preview__mount" #mount></div>
  } @else {
    <p class="cee-preview__missing">
      {{ 'ceePreview.missing.before' | translate }} <code>&lt;cedar-embeddable-editor&gt;</code
      >{{ 'ceePreview.missing.after' | translate }}
    </p>
  }
</div>
