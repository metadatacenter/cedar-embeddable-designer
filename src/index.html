<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CEDAR Embeddable Designer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-dev-host></app-dev-host>
    <!--
      The two sibling web components, loaded the way an embedding page loads
      them: term search is `<cedar-term-picker>` and the preview is
      `<cedar-embeddable-editor>`, and this bundle carries neither. `npm start`
      copies them into `public/` from the neighbouring repositories; where one is
      absent the designer says so in the panel that would have used it.
    -->
    <script src="cedar-term-picker.js"></script>
    <script src="cedar-embeddable-editor.js"></script>
  </body>
</html>
